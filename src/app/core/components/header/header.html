
<header
  class="sticky top-0 z-50
         bg-white
         border-b border-slate-200
         shadow-sm"
>

  <div class="max-w-7xl mx-auto px-4 lg:px-6">

    <div
      class="min-h-[72px]
             flex items-center
             gap-3 lg:gap-4"
    >


      <!-- ========================= -->
      <!-- Logo -->
      <!-- ========================= -->

      <div class="shrink-0">

        <a
          routerLink="/"
          class="text-2xl
                 font-extrabold
                 tracking-tight
                 text-blue-600
                 hover:text-blue-700
                 transition-colors"
        >
          ShopStore
        </a>

      </div>


      <!-- ========================= -->
      <!-- Location -->
      <!-- ========================= -->

      <div
        class="hidden lg:flex
               items-center
               gap-2
               px-3 py-2
               rounded-xl
               hover:bg-slate-50
               cursor-pointer
               transition-colors
               shrink-0"
      >

        <span class="text-xl">
          📍
        </span>

        <div class="flex flex-col leading-tight">

          <small
            class="text-[11px]
                   text-slate-400
                   font-medium"
          >
            Deliver to
          </small>

          <strong
            class="text-sm
                   text-slate-700
                   font-semibold
                   whitespace-nowrap"
          >
            Select Location
          </strong>

        </div>

      </div>


      <!-- ========================= -->
      <!-- Search -->
      <!-- ========================= -->

      <div class="flex-1 min-w-0">

        <div
          class="flex items-center
                 h-11
                 w-full
                 bg-[#f5f9fd]
                 border border-slate-200
                 rounded-xl
                 overflow-hidden
                 focus-within:border-blue-500
                 focus-within:ring-2
                 focus-within:ring-blue-100
                 transition-all"
        >

          <!-- Search Input -->

          <input
            type="text"
            [(ngModel)]="searchTerm"
            (keyup.enter)="onSearch()"
            placeholder="Search products, brands and more..."
            class="flex-1
                   min-w-0
                   h-full
                   px-4
                   bg-transparent
                   outline-none
                   text-sm
                   text-slate-700
                   placeholder:text-slate-400"
          />


          <!-- Search Button -->

          <button
            type="button"
            (click)="onSearch()"
            class="h-full
                   w-12
                   shrink-0
                   flex items-center
                   justify-center
                   text-blue-600
                   hover:bg-blue-50
                   transition-colors"
          >

            <span class="text-lg">
              🔍
            </span>

          </button>

        </div>

      </div>


      <!-- ========================= -->
      <!-- Language -->
      <!-- ========================= -->

      <div
        class="hidden xl:flex
               flex-col
               leading-tight
               px-3 py-2
               rounded-xl
               hover:bg-slate-50
               cursor-pointer
               transition-colors
               shrink-0"
      >

        <small
          class="text-[11px]
                 text-slate-400"
        >
          Language
        </small>

        <strong
          class="text-sm
                 text-slate-700"
        >
          English
        </strong>

      </div>


      <!-- ========================= -->
      <!-- Account -->
      <!-- ========================= -->

      <div
        class="hidden md:flex
               flex-col
               leading-tight
               px-3 py-2
               rounded-xl
               hover:bg-slate-50
               cursor-pointer
               transition-colors
               shrink-0"
      >

        <small
          class="text-[11px]
                 text-slate-400"
        >
          Hello, User
        </small>

        <strong
          class="text-sm
                 text-slate-700"
        >
          Account
        </strong>

      </div>


      <!-- ========================= -->
      <!-- Orders -->
      <!-- ========================= -->

      <div
        class="hidden lg:flex
               flex-col
               leading-tight
               px-3 py-2
               rounded-xl
               hover:bg-slate-50
               cursor-pointer
               transition-colors
               shrink-0"
      >

        <small
          class="text-[11px]
                 text-slate-400"
        >
          View
        </small>

        <strong
          class="text-sm
                 text-slate-700"
        >
          Orders
        </strong>

      </div>


      <!-- ========================= -->
      <!-- Cart -->
      <!-- ========================= -->
      
      <a
  routerLink="/cart"
  class="relative flex items-center justify-center w-10 h-10 rounded-xl hover:bg-slate-100 transition-colors">

  <span class="text-xl">
    🛒
  </span>

  @if (cartCount$ | async; as cartCount) {

    @if (cartCount > 0) {

      <span
        class="absolute -top-1 -right-1 min-w-5 h-5 px-1 flex items-center justify-center rounded-full bg-blue-600 text-white text-xs font-bold">

        {{ cartCount }}

      </span>

    }

  }

</a>
     
    </div>

  </div>

</header>
