<div class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden bg-[#edf5fb]">

  <!-- Background Decoration -->
  <div
    class="absolute -top-32 -left-32 w-[520px] h-[520px]
           rounded-full bg-[#d8ecfa]">
  </div>

  <div
    class="absolute -bottom-48 -right-32 w-[600px] h-[600px]
           rounded-full bg-[#dceefe]">
  </div>

  <div
    class="absolute top-[12%] right-[12%]
           w-20 h-20 rounded-[2rem]
           bg-blue-500/10 rotate-12">
  </div>

  <div
    class="absolute bottom-[18%] left-[13%]
           w-4 h-4 rounded-full
           bg-blue-400/40">
  </div>


  <!-- Main Content -->
  <div class="relative z-10 w-full max-w-md">

    <!-- Reset Password Card -->
    <div
      class="relative w-full bg-white
             rounded-[2rem] p-8 md:p-9
             border border-white
             shadow-[0_25px_80px_rgba(30,64,175,0.12)]"
    >

      <!-- Top Accent -->
      <div
        class="absolute top-0 left-8 right-8
               h-1.5 rounded-b-full
               bg-blue-600">
      </div>


      <!-- Header -->
      <div class="text-center mb-8">

        <p
          class="text-sm font-semibold
                 text-blue-600 uppercase
                 tracking-wider mb-2"
        >
          Account Security
        </p>

        <h1
          class="text-3xl font-bold
                 text-slate-900"
        >
          Reset Password
        </h1>

        <p
          class="mt-3 text-sm
                 text-slate-500 leading-6"
        >
          Enter your new password below
          to secure your account.
        </p>

      </div>


      <!-- Form -->
      <form
        (ngSubmit)="resetPassword()"
        class="space-y-5"
      >

        <!-- New Password -->
        <div>

          <label
            for="newPassword"
            class="block text-sm font-semibold
                   text-slate-700 mb-2"
          >
            New Password
          </label>

          <input
            id="newPassword"
            type="password"
            name="newPassword"
            placeholder="Enter new password"
            [(ngModel)]="newPassword"
            [disabled]="isSubmitting"
            class="w-full px-4 py-3.5
                   rounded-xl
                   border border-slate-200
                   bg-slate-50
                   text-slate-900
                   placeholder:text-slate-400
                   outline-none
                   transition
                   focus:border-blue-500
                   focus:ring-4
                   focus:ring-blue-500/10
                   disabled:opacity-60"
          />

        </div>


        <!-- Confirm Password -->
        <div>

          <label
            for="confirmPassword"
            class="block text-sm font-semibold
                   text-slate-700 mb-2"
          >
            Confirm Password
          </label>

          <input
            id="confirmPassword"
            type="password"
            name="confirmPassword"
            placeholder="Confirm new password"
            [(ngModel)]="confirmPassword"
            [disabled]="isSubmitting"
            class="w-full px-4 py-3.5
                   rounded-xl
                   border border-slate-200
                   bg-slate-50
                   text-slate-900
                   placeholder:text-slate-400
                   outline-none
                   transition
                   focus:border-blue-500
                   focus:ring-4
                   focus:ring-blue-500/10
                   disabled:opacity-60"
          />

        </div>


        <!-- Error Message -->
        @if (errorMessage) {

          <div
            class="p-3.5 rounded-xl
                   text-sm text-center
                   text-red-600
                   bg-red-50
                   border border-red-100"
          >
            {{ errorMessage }}
          </div>

        }


        <!-- Success Message -->
        @if (successMessage) {

          <div
            class="p-3.5 rounded-xl
                   text-sm text-center
                   text-emerald-600
                   bg-emerald-50
                   border border-emerald-100"
          >
            {{ successMessage }}
          </div>

        }


        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="isSubmitting || !token"
          class="w-full py-3.5
                 rounded-xl
                 bg-blue-600
                 hover:bg-blue-700
                 text-white
                 font-semibold
                 transition-all
                 duration-200
                 shadow-lg
                 shadow-blue-600/20
                 hover:shadow-blue-600/30
                 disabled:opacity-60
                 disabled:cursor-not-allowed"
        >

          @if (isSubmitting) {

            Resetting...

          } @else {

            Reset Password

          }

        </button>

      </form>


      <!-- Back to Login -->
      <div class="mt-7 text-center">

        <a
          routerLink="/auth/login"
          class="text-sm font-semibold
                 text-blue-600
                 hover:text-blue-700
                 transition-colors"
        >
          ← Back to Login
        </a>

      </div>


      <!-- Security Note -->
      <div
        class="mt-6 pt-5
               border-t border-slate-100"
      >

        <p
          class="text-xs text-center
                 text-slate-400"
        >
          🔒 Your password is securely encrypted
          and protected.
        </p>

      </div>

    </div>

  </div>

</div>
