<!-- Forgot Password Page -->
<div
  class="min-h-screen flex items-center justify-center
         p-4 relative overflow-hidden
         bg-[#edf5fb]"
>

  <!-- Background Decoration -->

  <!-- Large top-left glow -->
  <div
    class="absolute -top-32 -left-32
           w-[520px] h-[520px]
           rounded-full
           bg-[#d8ecfa]"
  ></div>

  <!-- Large bottom-right glow -->
  <div
    class="absolute -bottom-48 -right-32
           w-[600px] h-[600px]
           rounded-full
           bg-[#dceefe]"
  ></div>

  <!-- Soft center glow -->
  <div
    class="absolute top-1/2 left-1/2
           -translate-x-1/2 -translate-y-1/2
           w-[300px] h-[300px]
           rounded-full
           bg-blue-100/40
           blur-3xl"
  ></div>

  <!-- Decorative square -->
  <div
    class="absolute top-[12%] right-[12%]
           w-16 h-16
           rounded-[1.5rem]
           bg-blue-500/10
           rotate-12"
  ></div>

  <!-- Decorative small circle -->
  <div
    class="absolute bottom-[18%] left-[13%]
           w-4 h-4
           rounded-full
           bg-blue-400/40"
  ></div>

  <!-- Decorative small square -->
  <div
    class="absolute top-[25%] left-[18%]
           w-3 h-3
           rounded-sm
           bg-blue-300/50
           rotate-45"
  ></div>


  <!-- Forgot Password Card -->
  <div
    class="w-full max-w-md
           relative z-10
           bg-white
           border border-white
           rounded-[2rem]
           p-7
           shadow-[0_25px_70px_rgba(30,64,175,0.12)]"
  >

    <!-- Top Accent -->
    <div
      class="absolute top-0 left-8 right-8
             h-1.5
             bg-blue-600
             rounded-b-full"
    ></div>


    <!-- Icon -->
    <div class="flex justify-center mb-4">

      <div
        class="w-12 h-12
               rounded-2xl
               bg-blue-50
               border border-blue-100
               flex items-center justify-center"
      >

        <!-- Lock Icon -->
        <svg
          class="w-6 h-6 text-blue-600"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16 10V8a4 4 0 0 0-8 0v2"
          />

          <rect
            x="5"
            y="10"
            width="14"
            height="10"
            rx="2"
          />

          <path
            stroke-linecap="round"
            d="M12 14v2"
          />
        </svg>

      </div>

    </div>


    <!-- Heading -->
    <div class="text-center mb-6">

      <h1
        class="text-2xl
               font-bold
               text-slate-900
               tracking-tight"
      >
        Forgot Password
      </h1>

      <p
        class="mt-2
               text-sm
               leading-5
               text-slate-500"
      >
        Enter your email and we'll send you
        a password reset link.
      </p>

    </div>


    <!-- Form -->
    <form
      (ngSubmit)="forgotPassword()"
      class="space-y-4"
    >

      <!-- Email -->
      <div>

        <label
          for="email"
          class="block
                 text-sm
                 font-semibold
                 text-slate-700
                 mb-1.5"
        >
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          placeholder="Enter your email"
          [(ngModel)]="email"
          [disabled]="isSubmitting"
          class="w-full
                 px-4 py-3
                 bg-slate-50
                 border border-slate-200
                 rounded-xl
                 text-slate-900
                 placeholder:text-slate-400
                 outline-none
                 transition-all duration-200
                 focus:bg-white
                 focus:border-blue-500
                 focus:ring-4
                 focus:ring-blue-500/10
                 disabled:opacity-60
                 disabled:cursor-not-allowed"
        />

      </div>


      <!-- Error Message -->
      @if (errorMessage) {

        <p
          class="text-sm
                 text-red-600
                 bg-red-50
                 border border-red-200
                 rounded-xl
                 px-4 py-3"
        >
          {{ errorMessage }}
        </p>

      }


      <!-- Success Message -->
      @if (successMessage) {

        <p
          class="text-sm
                 text-emerald-600
                 bg-emerald-50
                 border border-emerald-200
                 rounded-xl
                 px-4 py-3"
        >
          {{ successMessage }}
        </p>

      }


      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="isSubmitting"
        class="w-full
               flex items-center justify-center gap-2
               px-5 py-3
               bg-blue-600
               hover:bg-blue-700
               active:bg-blue-800
               text-white
               font-semibold
               rounded-xl
               shadow-[0_8px_20px_rgba(37,99,235,0.20)]
               hover:shadow-[0_10px_25px_rgba(37,99,235,0.25)]
               transition-all duration-200
               disabled:opacity-60
               disabled:cursor-not-allowed
               disabled:hover:bg-blue-600"
      >

        @if (isSubmitting) {

          <!-- Loading Spinner -->
          <svg
            class="w-5 h-5 animate-spin"
            fill="none"
            viewBox="0 0 24 24"
          >

            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>

            <path
              class="opacity-90"
              fill="currentColor"
              d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
            ></path>

          </svg>

          Sending...

        } @else {

          Send Reset Link

        }

      </button>

    </form>


    <!-- Back to Login -->
    <div
      class="mt-5
             pt-5
             border-t border-slate-100
             text-center"
    >

      <a
        routerLink="/auth/login"
        class="inline-flex
               items-center
               gap-2
               text-sm
               font-semibold
               text-blue-600
               hover:text-blue-700
               transition-colors duration-200"
      >

        <!-- Arrow -->
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19 12H5"
          />

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 19l-7-7 7-7"
          />

        </svg>

        Back to Login

      </a>

    </div>

  </div>

</div>
